<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
<title id="title">Инженерная лаборатория Cloudboy</title>
<desc id="desc">Инженерная лаборатория: серверная стойка, терминал и две колбы на общем стенде. От верхней шины опускаются вертикальные линии передачи данных точно в центры сосудов. Индикаторы, терминал и пузырьки анимированы.</desc>
<defs>
<linearGradient id="rackSteel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243858"/><stop offset=".38" stop-color="#17253e"/><stop offset="1" stop-color="#0e1729"/></linearGradient>
<linearGradient id="screenGlass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#142640"/><stop offset="1" stop-color="#081322"/></linearGradient>
<linearGradient id="deskSteel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#304567"/><stop offset="1" stop-color="#15253d"/></linearGradient>
<linearGradient id="cyanLiquid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#89eeff" stop-opacity=".79"/><stop offset="1" stop-color="#3175db" stop-opacity=".67"/></linearGradient>
<linearGradient id="indigoLiquid" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#c2abff" stop-opacity=".78"/><stop offset="1" stop-color="#7361df" stop-opacity=".67"/></linearGradient>
<radialGradient id="screenBloom"><stop stop-color="#3d8fda" stop-opacity=".25"/><stop offset="1" stop-color="#3d8fda" stop-opacity="0"/></radialGradient>
<radialGradient id="lampPool"><stop stop-color="#f7ca85" stop-opacity=".20"/><stop offset="1" stop-color="#f7ca85" stop-opacity="0"/></radialGradient>
<filter id="pipeBloom" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
<radialGradient id="flameHalo"><stop stop-color="#ffb86e" stop-opacity=".31"/><stop offset=".55" stop-color="#ff8d3b" stop-opacity=".12"/><stop offset="1" stop-color="#ff8d3b" stop-opacity="0"/></radialGradient>
<linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ed6f33"/><stop offset=".5" stop-color="#ffab4f"/><stop offset="1" stop-color="#ffd892"/></linearGradient>
<clipPath id="terminalClip"><rect x="222" y="162" width="133" height="73" rx="4"/></clipPath>
<clipPath id="blueFluidClip"><path d="M429 203V222L405 275Q404 288 416 288H468Q480 288 479 275L453 222V203Z"/></clipPath>
<clipPath id="purpleFluidClip"><rect x="491" y="214" width="28" height="74" rx="14"/></clipPath>
</defs>
<style>
.status-led{animation:ledFlash 2.4s steps(1,end) infinite}.status-led.offset{animation-delay:.75s}.status-led.slow{animation-duration:3.4s;animation-delay:1.2s}
.pipe-flow{stroke-dasharray:3 25;stroke-dashoffset:0;animation:signalTravel 2.8s linear infinite}.pipe-flow.secondary{animation-duration:3.7s;animation-direction:reverse;animation-delay:.3s}
.terminal-scroll{animation:terminalFlow 10s steps(5,end) infinite}.cursor{animation:cursorBlink 1.1s steps(1,end) infinite}
.bubble{animation:bubbleUp 3.2s ease-in infinite}.bubble.b2{animation-delay:.8s;animation-duration:3.7s}.bubble.b3{animation-delay:1.7s;animation-duration:2.8s}.bubble.b4{animation-delay:2.5s;animation-duration:3.4s}
.fluid-shimmer{animation:liquidGlow 4.5s ease-in-out infinite}.scope{animation:scopePulse 4s ease-in-out infinite}
.burner-flame{transform-box:fill-box;transform-origin:center bottom;animation:flameFlicker 1.05s ease-in-out infinite alternate}
.burner-flame-inner{transform-box:fill-box;transform-origin:center bottom;animation:flameFlicker .75s ease-in-out infinite alternate-reverse}
.burner-glow{animation:flameGlow 1.2s ease-in-out infinite alternate}
@keyframes ledFlash{0%,60%,100%{opacity:.22}18%,40%{opacity:1}}
@keyframes signalTravel{to{stroke-dashoffset:-112}}
@keyframes terminalFlow{0%,13%{transform:translateY(0)}20%,33%{transform:translateY(-14px)}40%,53%{transform:translateY(-28px)}60%,73%{transform:translateY(-42px)}80%,93%{transform:translateY(-56px)}100%{transform:translateY(-70px)}}
@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes bubbleUp{0%{transform:translateY(12px);opacity:0}25%{opacity:.9}85%{opacity:.65}100%{transform:translateY(-40px);opacity:0}}
@keyframes liquidGlow{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes scopePulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes flameFlicker{0%{transform:scaleX(.86) scaleY(.92) rotate(-3deg)}33%{transform:scaleX(1.06) scaleY(1.08) rotate(2deg)}66%{transform:scaleX(.94) scaleY(.99) rotate(-1deg)}100%{transform:scaleX(1.02) scaleY(1.13) rotate(3deg)}}
@keyframes flameGlow{from{opacity:.48;transform:scale(.91)}to{opacity:.88;transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.status-led,.pipe-flow,.terminal-scroll,.cursor,.bubble,.fluid-shimmer,.scope,.burner-flame,.burner-flame-inner,.burner-glow{animation:none!important}}
</style>
